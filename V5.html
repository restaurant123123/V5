            { id: 40, cat: 'veg', name: '咸蛋黄焗金南瓜', desc: '南瓜外脆内糯，裹满沙软咸蛋黄', price: 20.00, isMarket: false, img: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=400&q=80', isRec: false },

            // ==================== 5. 主食白饭 ====================
            { id: 41, cat: 'staple', name: '精选高级香米白饭', desc: '粒粒饱满，酒楼标配米饭', price: 2.00, isMarket: false, img: 'https://images.unsplash.com/photo-1516684732162-798a0062be99?auto=format&fit=crop&w=400&q=80', isRec: false },
            { id: 42, cat: 'staple', name: '经典槟城干炒河粉/金牌干炒牛河', desc: '锅气十足，河粉弹牙牛肉滑嫩', price: 18.00, isMarket: false, img: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=400&q=80', isRec: true },
            { id: 43, cat: 'staple', name: '招牌福建大碌面', desc: '浓郁黑酱油焖煮粗面，猪油渣提香', price: 18.00, isMarket: false, img: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=400&q=80', isRec: true },
            { id: 44, cat: 'staple', name: '黄金粒粒香海鲜炒饭', desc: '特选香米大火翻炒海鲜碎，金黄松散', price: 20.00, isMarket: false, img: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=400&q=80', isRec: false },
            { id: 45, cat: 'staple', name: '生炒腊味糯米饭', desc: '广式腊肠腊肉生炒糯米，香糯暖胃', price: 22.00, isMarket: false, img: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=400&q=80', isRec: true },
            { id: 46, cat: 'staple', name: '砂锅生炒牛肉饭', desc: '砂锅高温生炒牛肉饭，焦香锅巴极诱人', price: 22.00, isMarket: false, img: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=400&q=80', isRec: false },

            // ==================== 6. 饮品甜品 ====================
            { id: 47, cat: 'drink', name: '泰国直供清甜冰镇大椰青', desc: '解腻神器，清甜解渴，现开现饮', price: 12.00, isMarket: false, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80', isRec: false },
            { id: 48, cat: 'drink', name: '鲜榨冰镇桔子酸梅汁', desc: '酸甜冰爽，消暑解腻', price: 6.00, isMarket: false, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80', isRec: false },
            { id: 49, cat: 'drink', name: '招牌港式杨枝甘露', desc: '芒果西柚西米露，香甜浓郁', price: 9.00, isMarket: false, img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=400&q=80', isRec: true },
            { id: 50, cat: 'drink', name: '冰镇百香果爱玉冰', desc: '百香果果香四溢，搭配爱玉冻清爽过瘾', price: 7.00, isMarket: false, img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80', isRec: false }
        ];

        let cart = {};

        function renderMenu(category = 'seafood') {
            const container = document.getElementById('menu-list');
            container.innerHTML = '';

            const filtered = dishes.filter(d => d.cat === category);

            filtered.forEach(dish => {
                const qty = cart[dish.id] || 0;
                const priceDisplay = dish.isMarket ? '<span class="text-[#D4AF37] font-black text-sm">时价</span>' : `<span class="text-[#C59B27] font-black text-sm">RM ${dish.price.toFixed(2)}</span>`;

                const html = `
                    <div class="bg-white border border-[#E6D5B8] rounded-2xl p-3 shadow-sm flex flex-col justify-between transition hover:shadow-md">
                        
                        <!-- 独立的图片容器：画中画勋章安全挂在图片内部左上角，绝对不遮挡菜单名 -->
                        <div class="relative w-full h-32 rounded-xl overflow-hidden mb-2.5 bg-[#F2EDE4] flex-shrink-0">
                            <img src="${dish.img}" alt="${dish.name}" class="w-full h-full object-cover">
                            ${dish.isRec ? `
                                <div class="absolute top-2 left-2 z-20 bg-black/60 backdrop-blur-md text-amber-300 border border-amber-400/50 text-[10px] font-black px-2 py-0.5 rounded-lg shadow flex items-center space-x-1">
                                    <span>👨‍🍳 厨师推荐</span>
                                </div>
                            ` : ''}
                        </div>

                        <!-- 文案及按钮区域 -->
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="font-black text-[#2C221E] text-sm leading-snug line-clamp-2">${dish.name}</h4>
                                <p class="text-xs text-[#7A6B63] line-clamp-2 mt-1 leading-relaxed">${dish.desc}</p>
                            </div>

                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-[#F2EDE4]">
                                ${priceDisplay}
                                <div class="flex items-center space-x-1.5">
                                    ${qty > 0 ? `
                                        <button onclick="updateCart(${dish.id}, -1)" class="w-6 h-6 bg-[#F2EDE4] text-[#C59B27] rounded-full font-bold flex items-center justify-center text-sm">-</button>
                                        <span class="text-[#2C221E] font-bold text-sm w-4 text-center">${qty}</span>
                                    ` : ''}
                                    <button onclick="updateCart(${dish.id}, 1)" class="bg-gradient-to-r from-[#D4AF37] to-[#C59B27] text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow active:scale-95 transition">
                                        ${qty > 0 ? '+' : '加入'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function filterMenu(cat) {
            // 切换顶部标签按钮高亮状态
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-xs font-medium bg-white text-[#5C4A42] border border-[#E6D5B8] shadow-sm transition";
            });
            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.className = "cat-btn flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-[#D4AF37] text-white shadow transition";
            }
            renderMenu(cat);
        }

        function updateCart(dishId, change) {
            if (!cart[dishId]) cart[dishId] = 0;
            cart[dishId] += change;
            if (cart[dishId] <= 0) delete cart[dishId];

            updateCartUI();
            
            // 获取当前选中的分类标签并刷新渲染
            const activeBtn = document.querySelector('.cat-btn.bg-\\[\\#D4AF37\\]');
            let activeCat = 'seafood';
            if(activeBtn) {
                activeCat = activeBtn.id.replace('btn-', '');
            }
            renderMenu(activeCat);
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            let container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            const keys = Object.keys(cart);
            if (keys.length === 0) {
                container.innerHTML = `<p class="text-center text-[#7A6B63] py-6 text-sm">购物车空空如也，快去挑选美味吧~</p>`;
            } else {
                keys.forEach(id => {
                    const dish = dishes.find(d => d.id == id);
                    const qty = cart[id];
                    totalCount += qty;
                    const itemPrice = dish.isMarket ? 0 : dish.price * qty;
                    totalPrice += itemPrice;

                    const priceText = dish.isMarket ? '时价 (现场确认)' : `RM ${itemPrice.toFixed(2)}`;

                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-[#E6D5B8]">
                            <div class="flex-1 min-w-0 pr-2">
                                <h4 class="text-[#2C221E] text-sm font-bold truncate">${dish.name}</h4>
                                <div class="text-[#C59B27] text-xs mt-0.5 font-bold">${priceText}</div>
                            </div>
                            <div class="flex items-center space-x-2 flex-shrink-0">
                                <button onclick="updateCart(${dish.id}, -1)" class="w-7 h-7 bg-[#F2EDE4] text-[#C59B27] rounded-full font-bold flex items-center justify-center text-sm">-</button>
                                <span class="text-[#2C221E] font-bold text-sm w-5 text-center">${qty}</span>
                                <button onclick="updateCart(${dish.id}, 1)" class="w-7 h-7 bg-[#D4AF37] text-white rounded-full font-bold flex items-center justify-center text-sm">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('cart-badge').innerText = totalCount;
            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = totalPrice.toFixed(2);
            document.getElementById('modal-count').innerText = totalCount;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkoutOrder() {
            const phone = document.getElementById('customer-phone').value.trim();
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);

            if (totalCount === 0) {
                alert('请先选择您想享用的菜品！');
                return;
            }
            if (phone.length < 7) {
                alert('为了方便为您出餐及发送会员优惠，请输入正确的手机号码！');
                return;
            }

            alert(`🎉 【鼎盛轩】下单成功！\n【A08桌】已成功提交订单。\n手机号: ${phone}\n后台云打印机已自动出单，厨房正在为您烹饪！`);
            
            cart = {};
            updateCartUI();
            toggleCartModal();
            document.getElementById('customer-phone', '').value = '';
            filterMenu('seafood');
        }

        // 默认进入时加载生猛海鲜分类
        filterMenu('seafood');
    </script>
</body>
</html>
